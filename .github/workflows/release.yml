
name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag (e.g. v1.5)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build Signed APK
    runs-on: ubuntu-latest

    steps:
      - name: Validate tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
          EVENT_NAME: ${{ github.event_name }}
          GITHUB_REF: ${{ github.ref }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            TAG="$INPUT_TAG"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi

          if ! [[ "$TAG" =~ ^v[0-9]+(\.[0-9]+)*$ ]]; then
            echo "Invalid tag: $TAG (example: v1.5)"
            exit 1
          fi

          echo "name=$TAG" >> "$GITHUB_OUTPUT"
        id: tag

      - name: Checkout tagged source
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ steps.tag.outputs.name }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -e
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" |
            base64 --decode > "$GITHUB_WORKSPACE/release.jks"
          test -s "$GITHUB_WORKSPACE/release.jks"
          file "$GITHUB_WORKSPACE/release.jks"

      - name: Build release APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/release.jks
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Build release AAB
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/release.jks
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew bundleRelease --no-daemon

      - name: Rename output files
        env:
          TAG: ${{ steps.tag.outputs.name }}
        run: |
          set -e
          mv app/build/outputs/apk/release/app-release.apk \
            "app/build/outputs/apk/release/assistive-menu-tool-${TAG}.apk"
          mv app/build/outputs/bundle/release/app-release.aab \
            "app/build/outputs/bundle/release/assistive-menu-tool-${TAG}.aab"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: assistive-menu-tool-${{ steps.tag.outputs.name }}-apk
          path: app/build/outputs/apk/release/assistive-menu-tool-${{ steps.tag.outputs.name }}.apk
          retention-days: 30

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: assistive-menu-tool-${{ steps.tag.outputs.name }}-aab
          path: app/build/outputs/bundle/release/assistive-menu-tool-${{ steps.tag.outputs.name }}.aab
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: Assistive Menu Tool ${{ steps.tag.outputs.name }}
          body: |
            ## Assistive Menu Tool ${{ steps.tag.outputs.name }}

            ### Download
            - **APK**: install langsung di Android (sideload)
            - **AAB**: untuk upload ke Google Play

            ### Changelog
            Perubahan versi ini: isi sesuai perubahan aktual.

            ### Verifikasi APK
            Jalankan:
            `sha256sum assistive-menu-tool-${{ steps.tag.outputs.name }}.apk`
          draft: false
          prerelease: false
          overwrite_files: true
          files: |
            app/build/outputs/apk/release/assistive-menu-tool-${{ steps.tag.outputs.name }}.apk
            app/build/outputs/bundle/release/assistive-menu-tool-${{ steps.tag.outputs.name }}.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Clean up keystore
        if: always()
        run: rm -f "$GITHUB_WORKSPACE/release.jks"
