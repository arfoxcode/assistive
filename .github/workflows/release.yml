name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.5)'
        required: true

jobs:
  build:
    name: Build Signed APK
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Java 17 ─────────────────────────────────────────────────────────
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # ── 3. Gradle permission ───────────────────────────────────────────────
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # ── 4. Decode keystore dari GitHub Secret ──────────────────────────────
      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > $GITHUB_WORKSPACE/release.jks
          # Validasi: file JKS harus mulai dengan magic bytes 0xFEEDFEED
          file $GITHUB_WORKSPACE/release.jks

      # ── 5. Build release APK ───────────────────────────────────────────────
      - name: Build release APK
        env:
          KEYSTORE_PATH:  ${{ github.workspace }}/release.jks
          KEY_ALIAS:      ${{ secrets.KEY_ALIAS }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD:   ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      # ── 6. Build release AAB ───────────────────────────────────────────────
      - name: Build release AAB
        env:
          KEYSTORE_PATH:  ${{ github.workspace }}/release.jks
          KEY_ALIAS:      ${{ secrets.KEY_ALIAS }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD:   ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew bundleRelease --no-daemon

      # ── 7. Tentukan nama tag ───────────────────────────────────────────────
      - name: Resolve tag name
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "name=${{ github.event.inputs.tag }}" >> $GITHUB_OUTPUT
          else
            echo "name=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      # ── 8. Rename output files ─────────────────────────────────────────────
      - name: Rename artifacts
        run: |
          TAG=${{ steps.tag.outputs.name }}
          mv app/build/outputs/apk/release/app-release.apk \
             app/build/outputs/apk/release/assistive-menu-tool-${TAG}.apk
          mv app/build/outputs/bundle/release/app-release.aab \
             app/build/outputs/bundle/release/assistive-menu-tool-${TAG}.aab

      # ── 9. Upload APK sebagai Actions artifact ─────────────────────────────
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: assistive-menu-tool-${{ steps.tag.outputs.name }}-apk
          path: app/build/outputs/apk/release/assistive-menu-tool-${{ steps.tag.outputs.name }}.apk
          retention-days: 30

      # ── 10. Upload AAB sebagai Actions artifact ────────────────────────────
      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: assistive-menu-tool-${{ steps.tag.outputs.name }}-aab
          path: app/build/outputs/bundle/release/assistive-menu-tool-${{ steps.tag.outputs.name }}.aab
          retention-days: 30

      # ── 11. Buat GitHub Release + lampirkan APK & AAB ─────────────────────
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: "Assistive Menu Tool ${{ steps.tag.outputs.name }}"
          body: |
            ## Assistive Menu Tool ${{ steps.tag.outputs.name }}

            ### Download
            - **APK** — install langsung di Android (sideload)
            - **AAB** — untuk upload ke Google Play

            ### Changelog
            _Update changelog di sini sebelum push tag._

            ### Verifikasi APK
            ```
            sha256sum assistive-menu-tool-${{ steps.tag.outputs.name }}.apk
            ```
          draft: false
          prerelease: false
          files: |
            app/build/outputs/apk/release/assistive-menu-tool-${{ steps.tag.outputs.name }}.apk
            app/build/outputs/bundle/release/assistive-menu-tool-${{ steps.tag.outputs.name }}.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── 12. Hapus keystore dari runner ─────────────────────────────────────
      - name: Clean up keystore
        if: always()
        run: rm -f $GITHUB_WORKSPACE/release.jks
